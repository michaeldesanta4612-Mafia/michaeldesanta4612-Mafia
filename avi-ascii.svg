<svg xmlns="http://www.w3.org/2000/svg"
width="700" height="500">

<rect width="700" height="500"
rx="12" fill="#090d14"/>

<style>
.a{
font-family:"Courier New",monospace;
font-size:14px;
font-weight:600;
fill:#d7dde5
}

.r{
opacity:0;
animation:p .55s ease-out forwards
}

@keyframes p{
from{
opacity:0;
transform:translateX(-18px)
}
to{
opacity:1;
transform:translateX(0)
}
}
</style>

<g text-anchor="middle">

<text x="350" y="90" class="a r">
.-''''''-.
</text>

<text x="350" y="110" class="a r"
style="animation-delay:.1s">
.'  .--.  '.
</text>

<text x="350" y="130" class="a r"
style="animation-delay:.2s">
/   /    \   \
</text>

<text x="350" y="150" class="a r"
style="animation-delay:.3s">
;   |  o  o |   ;
</text>

<text x="350" y="170" class="a r"
style="animation-delay:.4s">
|   |   __ |   |
</text>

<text x="350" y="190" class="a r"
style="animation-delay:.5s">
;    \____/    ;
</text>

<text x="350" y="210" class="a r"
style="animation-delay:.6s">
\            /
</text>

<text x="350" y="230" class="a r"
style="animation-delay:.7s">
'.        .'
</text>

<text x="350" y="250" class="a r"
style="animation-delay:.8s">
'-.__.-'
</text>

<text x="350" y="300" class="a r"
style="animation-delay:.9s">
A D I X 4 6 1 2
</text>

<text x="350" y="350" class="a r"
style="animation-delay:1s">
ASCII PORTRAIT
</text>

<text x="350" y="390" class="a r"
style="animation-delay:1.1s">
TERMINAL MODE
</text>

</g>

</svg>
