<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500">

<rect width="840" height="490" x="5" y="5"
rx="12" fill="#090d14" stroke="#8b5cf6" stroke-width="2"/>

<style>
.t,.k,.v{
font-family:"Courier New",monospace
}

.t{
font-size:30px;
font-weight:bold;
fill:#bc8cff
}

.k{
font-size:21px;
font-weight:bold
}

.v{
font-size:18px;
fill:#e6edf3
}

.i{
opacity:0;
animation:a .5s ease-out forwards
}

@keyframes a{
from{
opacity:0;
transform:translateX(-15px)
}
to{
opacity:1;
transform:translateX(0)
}
}
</style>

<text x="35" y="50" class="t">
&gt; adix4612
</text>

